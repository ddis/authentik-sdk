[project]
name = "authentik-sso"
version = "0.1.0"
description = "Reusable Authentik OIDC login/logout/session-check plumbing for FastAPI services"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100",
    "authlib>=1.3",
    "httpx>=0.25",
    "itsdangerous>=2.1",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
